{% extends "layouts/main.html" %}

{% block content %}
<div class="auth-card">
    <h2>Login</h2>

    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}

    <form id="loginForm" method="post" action="/login/">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" id="username" name="username" required>

        <label>Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Log in</button>
    </form>

    <div id="apiError" class="alert error" style="display:none; margin-top:15px;"></div>

    <div class="auth-footer">
        Don’t have an account? <a href="/register/">Register</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.target;
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("apiError");

    errorBox.style.display = "none";
    errorBox.textContent = "";

    const response = await fetch("/api/token/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    });

    const data = await response.json();

    if (!response.ok) {
        errorBox.textContent = "Incorrect username or password";
        errorBox.style.display = "block";
        return;
    }

    localStorage.setItem("access", data.access);
    localStorage.setItem("refresh", data.refresh);

    // Після збереження JWT робимо звичайний Django login
    form.submit();
});
</script>
{% endblock %}
