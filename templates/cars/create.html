{% extends "layouts/main.html" %}

{% block title %}Add Car{% endblock %}

{% block content %}
<div class="card">
    <h2>Add a New Car</h2>

    <form method="post" action="{% url 'car_create' %}">
        {% csrf_token %}
        <label for="brand">Brand</label>
        <input type="text" id="brand" name="brand" required>

        <label for="model">Model</label>
        <input type="text" id="model" name="model" required>

        <label for="manufacture_year">Year of Manufacture</label>
        <input type="number" id="manufacture_year" name="manufacture_year" required>

        <label for="plate_number">License Plate</label>
        <input type="text" id="plate_number" name="plate_number" required>

        <label for="color">Colour</label>
        <input type="text" id="color" name="color" required>

        <label for="price_per_day">Price per Day</label>
        <input type="number" step="0.01" id="price_per_day" name="price_per_day" required>

        <label for="image_url">Photo (URL)</label>
        <input type="text" id="image_url" name="image_url">

        <button type="submit" class="btn btn-primary">Create</button>
    </form>
</div>
{% endblock %}
