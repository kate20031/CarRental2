{% extends "layouts/main.html" %}

{% block content %}
<div class="card">
    <h2>Car Returns</h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client</th>
                    <th>Car</th>
                    <th>Period</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="returnsTable">
                <tr>
                    <td colspan="5">Loading active rentals...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadReturns() {
    const token = localStorage.getItem("access");
    const tableBody = document.getElementById("returnsTable");

    if (!token) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="5">No JWT token found. Please log in again.</td>
            </tr>
        `;
        return;
    }

    const response = await fetch("/api/orders/returns/", {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (response.status === 401) {
        localStorage.removeItem("access");
        tableBody.innerHTML = `
            <tr>
                <td colspan="5">API authentication failed. Please log in again.</td>
            </tr>
        `;
        return;
    }

    if (response.status === 403) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="5">Access denied. Only admin can register returns.</td>
            </tr>
        `;
        return;
    }

    const orders = await response.json();

    tableBody.innerHTML = "";

    if (orders.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="5">No active rentals to return.</td>
            </tr>
        `;
        return;
    }

    orders.forEach(order => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${order.id}</td>
            <td>${order.client_full_name}</td>
            <td>${order.car_brand} ${order.car_model}</td>
            <td>${order.rent_start} - ${order.rent_end}</td>
            <td>
                <div class="return-action">
                    <label class="checkbox-row">
                        <input type="checkbox"
                               id="damage-${order.id}"
                               onchange="toggleDamageFields(${order.id})">
                        Has damage
                    </label>

                    <div id="damage-fields-${order.id}" class="damage-fields" style="display:none;">
                        <input type="text"
                               id="description-${order.id}"
                               placeholder="Damage description">

                        <input type="number"
                               id="amount-${order.id}"
                               step="0.01"
                               placeholder="Repair cost">
                    </div>

                    <button class="btn btn-success"
                            onclick="returnOrder(${order.id})">
                        Register Return
                    </button>
                </div>
            </td>
        `;

        tableBody.appendChild(row);
    });
}

function toggleDamageFields(orderId) {
    const checkbox = document.getElementById(`damage-${orderId}`);
    const fields = document.getElementById(`damage-fields-${orderId}`);

    fields.style.display = checkbox.checked ? "flex" : "none";
}

async function returnOrder(orderId) {
    const token = localStorage.getItem("access");

    if (!token) {
        alert("No JWT token found. Please log in again.");
        return;
    }

    const hasDamage = document.getElementById(`damage-${orderId}`).checked;

    const body = {
        has_damage: hasDamage
    };

    if (hasDamage) {
        const description = document.getElementById(`description-${orderId}`).value.trim();
        const amount = document.getElementById(`amount-${orderId}`).value.trim();

        if (!description) {
            alert("Please enter damage description.");
            return;
        }

        if (!amount || Number(amount) <= 0) {
            alert("Please enter a valid repair cost.");
            return;
        }

        body.damage_description = description;
        body.repair_amount = amount;
    }

    const response = await fetch(`/api/orders/returns/${orderId}/`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Return registration failed.");
        return;
    }

    alert(data.message || "Return registered successfully.");
    await loadReturns();
}

loadReturns();
</script>
{% endblock %}
