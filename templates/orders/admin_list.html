{% extends "layouts/main.html" %}

{% block content %}
<div class="card">
    <h2>Order Management</h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Client</th>
                    <th>Car</th>
                    <th>Period</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Payment</th>
                    <th>Rejection Reason</th>
                    <th>Actions</th>
                    <th>Repair</th>
                </tr>
            </thead>

            <tbody id="ordersTable">
                <tr>
                    <td colspan="10">Loading orders...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadOrders() {
    const token = localStorage.getItem("access");
    const tableBody = document.getElementById("ordersTable");

    if (!token) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="10">No JWT token found. Please log in again.</td>
            </tr>
        `;
        return;
    }

    const response = await fetch("/api/orders/", {
        method: "GET",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    if (response.status === 401) {
        localStorage.removeItem("access");
        tableBody.innerHTML = `
            <tr>
                <td colspan="10">API authentication failed. Please log in again.</td>
            </tr>
        `;
        return;
    }

    if (response.status === 403) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="10">Access denied. Only admin can view this page.</td>
            </tr>
        `;
        return;
    }

    const orders = await response.json();
    tableBody.innerHTML = "";

    if (orders.length === 0) {
        tableBody.innerHTML = `
            <tr>
                <td colspan="10">No orders yet.</td>
            </tr>
        `;
        return;
    }

    orders.forEach(order => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${order.id}</td>
            <td>${order.client_full_name}</td>
            <td>${order.car_brand} ${order.car_model}</td>
            <td>${order.rent_start} - ${order.rent_end}</td>
            <td>${order.total_amount} UAH</td>

            <td>
                <span class="badge badge-${order.order_status}">
                    ${order.order_status}
                </span>
            </td>

            <td>
                ${buildPaymentCell(order)}
            </td>

            <td>${order.rejection_reason || "-"}</td>

            <td>
                ${buildActionsCell(order)}
            </td>

            <td>
                ${buildRepairCell(order)}
            </td>
        `;

        tableBody.appendChild(row);
    });
}

function buildPaymentCell(order) {
    if (order.order_status === "rejected") {
        return "—";
    }

    return `
        <span class="badge badge-${order.payment_status}">
            ${order.payment_status}
        </span>
    `;
}

function buildActionsCell(order) {
    if (order.order_status !== "pending") {
        return "No actions";
    }

    return `
        <div class="action-box">
            <button class="btn btn-success" onclick="approveOrder(${order.id})">
                Approve
            </button>

            <input type="text"
                   id="reason-${order.id}"
                   placeholder="Rejection reason">

            <button class="btn btn-danger" onclick="rejectOrder(${order.id})">
                Reject
            </button>
        </div>
    `;
}

function buildRepairCell(order) {
    if (!order.invoice) {
        return "-";
    }

    if (order.invoice.is_paid) {
        return `
            <span class="badge badge-paid">
                ✔ Paid
            </span>
        `;
    }

    return `
        <span class="badge badge-unpaid">
            ❗ Unpaid: ${order.invoice.repair_amount} UAH
        </span>
        <br>
        <small>${order.invoice.description}</small>
    `;
}

async function approveOrder(orderId) {
    const token = localStorage.getItem("access");

    const response = await fetch(`/api/orders/${orderId}/approve/`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Approve failed.");
        return;
    }

    await loadOrders();
}

async function rejectOrder(orderId) {
    const token = localStorage.getItem("access");
    const reasonInput = document.getElementById(`reason-${orderId}`);
    const reason = reasonInput.value.trim();

    if (!reason) {
        alert("Please enter rejection reason.");
        return;
    }

    const response = await fetch(`/api/orders/${orderId}/reject/`, {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            rejection_reason: reason
        })
    });

    const data = await response.json();

    if (!response.ok) {
        alert(data.error || "Reject failed.");
        return;
    }

    await loadOrders();
}

loadOrders();
</script>
{% endblock %}
